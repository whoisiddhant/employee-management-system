
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Employee | EMS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .confirmation-box {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.07);
        }

        .warning-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 25px;
        }

        .message {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .employee-name {
            color: #1e293b;
            font-weight: bold;
        }

        .warning {
            background: #fef2f2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 7px;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        button, .cancel {
            flex: 1;
            padding: 12px;
            border-radius: 7px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            border: none;
        }

        button {
            background: #dc2626;
            color: white;
        }

        button:hover {
            background: #b91c1c;
        }

        .cancel {
            background: #e2e8f0;
            color: #334155;
        }

        .cancel:hover {
            background: #cbd5e1;
        }
    </style>
</head>

<body>

    <div class="confirmation-box">

        <div class="warning-icon">⚠️</div>

        <h1>Delete Employee?</h1>

        <p class="message">
            Are you sure you want to delete
            <span class="employee-name">{{ employee.full_name }}</span>?
        </p>

        <div class="warning">
            This action is permanent. The employee's login account
            will also be deleted.
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="actions">
                <a href="{% url 'dashboard' %}" class="cancel">Cancel</a>

                <button type="submit">Yes, Delete</button>
            </div>
        </form>

    </div>

</body>
</html>
