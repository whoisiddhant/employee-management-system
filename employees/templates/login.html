
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EMS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 55px;
            height: 55px;
            background: #2563eb;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        h2 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 8px;
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 14px;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">EMS</div>

        <h2>Welcome Back</h2>
        <p class="subtitle">Login to your Employee Management System</p>

        {% if form.errors %}
            <div class="error">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="id_username">Username</label>
            <input
                type="text"
                name="username"
                id="id_username"
                placeholder="Enter your username"
                required
            >

            <label for="id_password">Password</label>
            <input
                type="password"
                name="password"
                id="id_password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>
        </form>

      <p class="register-link">
    Employee accounts are created by the administrator.
</p>

    </div>

</body>
</html>
